name: Space Facts Automated Pipeline

on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours -> 6 uploads/day
  workflow_dispatch: {}

concurrency:
  group: spacefacts-pipeline
  cancel-in-progress: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies & fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install google-generativeai edge-tts moviepy pillow requests google-auth-oauthlib

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit updated state + upload log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_spacefacts.json upload_log.jsonl || true
          if ! git diff --staged --quiet; then
            git commit -m "Update state after run [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
