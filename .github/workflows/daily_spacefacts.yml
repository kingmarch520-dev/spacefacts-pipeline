name: Space Facts Automated Pipeline

on:
  schedule:
    # Times below are UTC. Local time is GMT+2 (CAT).
    # Trimmed from 6 runs/day to 2 — concentrating the fixed viewer
    # pool on fewer, sharper videos instead of spreading it thin
    # across a volume of near-identical performers.
    - cron: "0 16 * * *"   # 18:00 CAT - evening peak
    - cron: "0 6 * * *"    # 08:00 CAT - morning
  workflow_dispatch: {}  # Manual trigger option

concurrency:
  group: spacefacts-pipeline
  cancel-in-progress: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies & fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install google-generativeai edge-tts moviepy pillow requests numpy google-auth-oauthlib

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python main_spacefacts.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_spacefacts.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update state after run [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi