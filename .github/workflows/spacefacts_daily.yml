name: Render Story Episode

on:
  workflow_dispatch:
    inputs:
      story_file:
        description: Story JSON path
        required: true
        default: stories/episode_001.json
        type: string

      upload:
        description: Upload after rendering
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TTS_VOICE: en-US-AndrewMultilingualNeural
      YOUTUBE_PRIVACY: private

      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Render episode
        env:
          STORY_FILE: ${{ inputs.story_file }}
        run: |
          if [ "${{ inputs.upload }}" = "true" ]; then
            python main.py --story "$STORY_FILE" --upload
          else
            python main.py --story "$STORY_FILE"
          fi

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-story-episode
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Save episode continuity state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add episode_state.json || true
          git commit -m "Update episode continuity state" || true
          git push || true