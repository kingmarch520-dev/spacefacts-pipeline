name: SpaceFacts Daily

on:
  schedule:
    # 10:00 and 22:00 Zimbabwe time (UTC+2)
    - cron: "0 8,20 * * *"

  workflow_dispatch:

concurrency:
  group: spacefacts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-genai \
            edge-tts \
            moviepy \
            pillow \
            requests \
            google-auth-oauthlib

      - name: Run SpaceFacts
        run: |
          python main.py

      - name: Commit updated state and upload log
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state_spacefacts.json

          if [ -f upload_log.jsonl ]; then
            git add upload_log.jsonl
          fi

          if ! git diff --staged --quiet; then
            git commit -m "Update SpaceFacts state [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No state changes to commit."
          fi